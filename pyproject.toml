[project]
name = "opsdevcode-specmint"
version = "0.1.0a2"
description = "SpecMint core: HTTP API, compile, snapshots, plan, lifecycle, fake providers."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = "==3.12.*"
authors = [{ name = "opsdevcode" }]
dependencies = [
  "fastapi==0.141.1",
  "starlette==1.6.0",
  "uvicorn[standard]==0.53.0",
  "pydantic==2.13.5",
  "pyyaml==6.0.2",
]

[project.optional-dependencies]
durable = [
  "psycopg[binary]==3.2.9",
]
dev = [
  "httpx==0.28.1",
  "pytest==9.1.1",
  "ruff==0.11.12",
  "mypy==1.15.0",
  "bandit[toml]==1.8.3",
  "pip-audit==2.9.0",
  "types-PyYAML==6.0.12.20250516",
  "build==1.2.2",
]

[project.urls]
Homepage = "https://github.com/opsdevcode/specmint-platform"
Documentation = "https://github.com/opsdevcode/specmint-platform#readme"
Issues = "https://github.com/opsdevcode/specmint-platform/issues"

[project.scripts]
specmint = "opsdevcode_specmint.cli:main"
mint = "opsdevcode_specmint.mint.cli:main"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: tests that require Docker PostgreSQL and/or a subprocess HTTP server",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
warn_return_any = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
disallow_untyped_defs = true
mypy_path = ["src"]
packages = ["opsdevcode_specmint"]

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["psycopg", "psycopg.*"]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B603", "B404"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
tag_format = "v{version}"
commit_message = "chore(release): {version}"
upload_to_vcs_release = false
upload_to_pypi = false
major_on_zero = false

[tool.semantic_release.branches.main]
match = "main"
prerelease = true
prerelease_token = "alpha"
