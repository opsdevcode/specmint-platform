name: Publish SpecMint Container

# A Release Please prerelease is the only container publication trigger.
# Publish only ghcr.io/opsdevcode/specmint:<semver>; never push latest or stable.

on:
  release:
    types:
      - published

permissions: {}

concurrency:
  group: container-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  ghcr:
    if: github.event.release.prerelease == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/opsdevcode/specmint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Resolve immutable image tag
        id: meta
        run: |
          set -euo pipefail
          TAG="${{ github.event.release.tag_name }}"
          if [[ ! "${TAG}" =~ ^v0\.[0-9]+\.[0-9]+-alpha\.[0-9]+$ ]]; then
            echo "refuse non-alpha, latest, stable, or 1.x tag ${TAG}"
            exit 1
          fi
          VERSION="${TAG#v}"
          PYPROJECT_VERSION="$(python3 -c 'import tomllib, pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          if [[ "${PYPROJECT_VERSION}" != "${VERSION}" ]]; then
            echo "release tag ${TAG} must match pyproject.toml ${PYPROJECT_VERSION}"
            exit 1
          fi
          echo "version=${VERSION}" >>"${GITHUB_OUTPUT}"

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Refuse an existing immutable image tag
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if docker manifest inspect "${IMAGE}:${VERSION}" >/dev/null 2>&1; then
            echo "${IMAGE}:${VERSION} already exists; refusing overwrite"
            exit 1
          fi

      - name: Build tagged image once (no latest)
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          docker build -t "${IMAGE}:${VERSION}" .
          docker image inspect --format='{{.Id}}' "${IMAGE}:${VERSION}" | tee image-id.txt
          ! docker image inspect "${IMAGE}:latest" >/dev/null 2>&1

      - name: Smoke fake-local lifecycle probes
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          cid="$(docker run -d --rm --name specmint-smoke -p 127.0.0.1:18080:8080 "${IMAGE}:${VERSION}")"
          cleanup() { docker stop "${cid}" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for _ in $(seq 1 30); do
            curl -sf "http://127.0.0.1:18080/healthz" >/tmp/specmint-healthz.json && break
            sleep 2
          done
          curl -sf "http://127.0.0.1:18080/healthz" | tee /tmp/specmint-healthz.json
          curl -sf "http://127.0.0.1:18080/readyz" | tee /tmp/specmint-readyz.json
          python3 -c 'import json,pathlib; h=json.loads(pathlib.Path("/tmp/specmint-healthz.json").read_text()); r=json.loads(pathlib.Path("/tmp/specmint-readyz.json").read_text()); assert h["status"]=="ok" and h["service"]=="specmint"; assert r["status"]=="ok"'

      - name: Vulnerability scan (trivy/grype if present)
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          TARGET="${IMAGE}:${VERSION}"
          if command -v trivy >/dev/null 2>&1; then
            trivy image --exit-code 0 --severity HIGH,CRITICAL "${TARGET}"
          elif command -v grype >/dev/null 2>&1; then
            grype "${TARGET}"
          else
            echo "neither trivy nor grype is installed on the runner; skip scan (no extra scanner credentials)."
          fi

      - name: Push immutable version tag (never latest)
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          docker push "${IMAGE}:${VERSION}"
          docker inspect --format='{{index .RepoDigests 0}}' "${IMAGE}:${VERSION}" | tee image-digest.txt

      - name: Record digest
        id: digest
        run: |
          DIGEST="$(cut -d@ -f2 image-digest.txt)"
          [[ "${DIGEST}" == sha256:* ]]
          echo "digest=${DIGEST}" >>"${GITHUB_OUTPUT}"

      - name: SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/opsdevcode/specmint:${{ steps.meta.outputs.version }}
          format: spdx-json
          artifact-name: specmint-image.spdx.json
          output-file: specmint.spdx.json
          upload-artifact: true
          upload-release-assets: false
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest image
        uses: actions/attest-build-provenance@db473fddc028af60658334401dc6fa3ffd8669fd # v2.3.0
        with:
          subject-name: ghcr.io/opsdevcode/specmint
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
