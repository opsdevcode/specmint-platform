name: Conventional Commits

# Org source of truth for PR titles + commit messages.
# Product repos may copy this file until it exists on default branch, then:
#   jobs:
#     conventional-commits:
#       uses: opsdevcode/.github/.github/workflows/conventional-commits.yml@main

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
  workflow_call:

concurrency:
  group: conventional-commits-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  semantic-pull-request:
    runs-on: ubuntu-latest
    steps:
      - name: Skip Dependabot default Bump titles
        if: github.actor == 'dependabot[bot]'
        run: echo "Dependabot titles use Bump; skip uppercase subject rule"
      - if: github.actor != 'dependabot[bot]'
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject must not start with an uppercase character.

  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed
        with:
          configFile: .github/commitlint.config.mjs
