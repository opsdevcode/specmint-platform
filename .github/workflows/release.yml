name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Install
        run: pip install --no-cache-dir -e ".[dev]"
      - name: Tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q -m "not integration" --strict-markers
      - name: Build Python dist
        run: python -m build --sdist --wheel --outdir dist
      - name: Record dist digests
        run: |
          python - <<'PY'
          import hashlib, pathlib
          for path in sorted(pathlib.Path("dist").glob("*")):
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              print(f"{digest}  {path.name}")
          PY
      - name: Create GitHub Release (prerelease)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "${TAG}" \
            --prerelease \
            --title "SpecMint ${TAG#v}" \
            --notes "SpecMint platform ${TAG}. Fake providers by default. mint apply is not included. Hosted service stays private. Mint language: https://github.com/opsdevcode/specmint-language" \
            dist/*
